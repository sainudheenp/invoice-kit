[package]
name = "tae-pdf"
version = "2.3.1"
edition = "2021"
description = "Client-side HTML to PDF engine powered by TypeScript and Rust"

[lib]
path = "src/lib/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
flate2 = "1"
rustybuzz = "0.20.1"
brotli-decompressor = "5.0.3"


[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--all-features"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
overflow-checks = false
strip = true
